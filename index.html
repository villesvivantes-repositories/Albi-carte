<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b36">
  <title>Albi — Villes Vivantes</title>
  <meta name="description" content="Explorez Albi en carte illustrée. Une réalisation Villes Vivantes.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Albi — Villes Vivantes">
  <meta property="og:description" content="Une carte illustrée à explorer, du Tarn aux quartiers d’Albi.">
  <meta property="og:image" content="https://annecycarte.b-cdn.net/albi/v1/partage.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="vendor/openseadragon.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="map">
    <h1 class="sr-only">Carte illustrée d’Albi</h1>
    <div id="viewer" tabindex="0" role="region" aria-label="Carte interactive d’Albi. Glisser pour déplacer, molette ou pincement pour zoomer. Touches plus et moins pour zoomer, zéro pour recentrer, F pour le plein écran."></div>
    <div id="status" role="status" aria-live="polite">Chargement de la carte…</div>
    <section id="error" class="panel" role="alert" hidden>
      <h2>La carte n’est pas disponible pour le moment.</h2>
      <p>Réessaie dans quelques instants.</p>
      <button id="retry" type="button">Réessayer</button>
    </section>
    <footer><button id="credits-toggle" type="button" aria-expanded="false" aria-controls="credits">Villes Vivantes 2026</button></footer>
    <section id="credits" class="panel credits" aria-labelledby="credits-title" hidden>
      <h2 id="credits-title">Albi · carte illustrée</h2>
      <p>Glisser pour explorer, molette ou pincement pour zoomer. Touche 0 pour recentrer, F pour le plein écran.</p>
      <p id="source-credits"></p>
      <a href="https://vv.place/" target="_blank" rel="noopener noreferrer">Villes Vivantes</a>
      <button id="credits-close" type="button">Fermer</button>
    </section>
    <noscript><p class="panel">Active JavaScript pour explorer cette carte.</p></noscript>
  </main>
</body>
</html>
